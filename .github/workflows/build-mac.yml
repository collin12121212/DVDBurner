name: Build Burnhouse for macOS

# Produces the .dmg. Everything the app needs — ffmpeg, dvdauthor and their
# libraries — is fetched and made relocatable here, so the Mac it is installed on
# needs nothing installed beforehand.
#
# THE RUNNER MUST BE INTEL. The Mac this is for is a 2017 MacBook Air, which is
# x86_64. On an Apple Silicon runner Homebrew installs arm64 tools, and an arm64
# binary cannot run on an Intel Mac at all: the app would install, launch, and
# then fail the moment a video was added. Hence `macos-15-intel`, which is what
# replaced the retired `macos-13`.
#
# The build is x86_64 only. That is not a limitation — an Intel build runs
# natively on her Mac and under Rosetta on any Apple Silicon Mac, so one build
# covers both, and it is the only option that also gets working tools.
#
# This workflow is also the only place the disc-authoring pipeline is tested
# against a real dvdauthor on macOS, so the test step gates the build: if
# authoring breaks, no artifact is produced.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Test the pipeline
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the tools
        run: |
          # No `brew update`. The runner images ship with a current Homebrew, and
          # updating it costs minutes of nothing on every build.
          brew install ffmpeg dvdauthor
          echo "--- versions ---"
          ffmpeg -version | head -1
          dvdauthor --version 2>&1 | head -1
          which dvdauthor spumux ffmpeg ffprobe

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Core pipeline tests
        run: npm run test:core

      - name: Sharing server tests
        run: npm run test:server

      - name: Menu rendering tests
        run: npx electron test/menu.js

      - name: Upload menu samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-samples
          path: test/menu-samples/
          if-no-files-found: ignore

  build:
    name: Build the app
    needs: test
    if: ${{ github.event_name != 'pull_request' || needs.test.result == 'success' }}
    runs-on: macos-15-intel
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the tools
        run: |
          # No `brew update`; the runner image is already current.
          brew install ffmpeg dvdauthor

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Show what the tools link against
        run: |
          # Printed before any rewriting, so a bundling failure can be read
          # straight off the log. Working out what a relocator tripped over from
          # its error message alone is guesswork.
          for tool in ffmpeg ffprobe dvdauthor spumux; do
            echo "=== ${tool} ($(command -v ${tool})) ==="
            otool -L "$(command -v ${tool})" | tail -n +2
          done

      - name: Collect and relocate the tools
        run: |
          set -euo pipefail
          chmod +x scripts/bundle-deps.sh

          mkdir -p vendor/bin

          FFMPEG="$(command -v ffmpeg)"
          FFPROBE="$(command -v ffprobe)"
          DVDAUTHOR="$(command -v dvdauthor)"
          SPUMUX="$(command -v spumux)"

          echo "Found: $FFMPEG $FFPROBE $DVDAUTHOR $SPUMUX"

          # Tee to a file as well as the log. `pipefail` is set above, so a
          # failure here still fails the step.
          ./scripts/bundle-deps.sh vendor/bin \
            "$FFMPEG" "$FFPROBE" "$DVDAUTHOR" "$SPUMUX" 2>&1 | tee /tmp/bundle.log

          echo "--- bundled ---"
          ls -la vendor/bin
          ls -la vendor/bin/lib | head -40

          # The rebuilt binaries must still be x86_64. Rewriting load commands
          # has never changed an architecture, but this is the one place where a
          # surprise would be silent until somebody's Mac refused to run it.
          for tool in ffmpeg ffprobe dvdauthor spumux; do
            echo -n "${tool} arch after relocation: "
            lipo -archs "vendor/bin/${tool}"
          done

      - name: Publish the bundling output where it can be read
        if: failure()
        run: |
          # Reading a failed step's log through the API needs a token, which
          # this repository does not have. Publishing the output to a branch
          # makes a failure readable with nothing but a clone, instead of
          # somebody having to copy it out of the web interface by hand.
          {
            echo "=== bundle-deps output ==="
            cat /tmp/bundle.log 2>/dev/null || echo "(nothing was captured)"
            echo
            echo "=== run context ==="
            echo "runner: $(uname -m) $(sw_vers -productVersion 2>/dev/null)"
            echo "brew prefix: $(brew --prefix 2>/dev/null)"
            echo
            echo "=== what each tool links against ==="
            for tool in ffmpeg ffprobe dvdauthor spumux; do
              echo "--- ${tool}"
              otool -L "$(command -v ${tool} 2>/dev/null)" 2>/dev/null | tail -n +2 || true
            done
            echo
            echo "=== anything that came out of the bundling ==="
            find vendor -type f 2>/dev/null | head -60 || true
          } > ci-diagnostics.txt 2>&1 || true

          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout -B ci-diagnostics
          git add -f ci-diagnostics.txt
          git commit -m "Bundling diagnostics for ${GITHUB_SHA}" || true
          git push -f origin ci-diagnostics || true

      - name: Verify the bundled tools run from a different directory
        run: |
          set -euo pipefail
          # Moving the bundle proves nothing depends on Homebrew still being on
          # the path. This is the check that catches a missed dylib.
          mkdir -p /tmp/relocated
          cp -R vendor/bin /tmp/relocated/bin
          cd /tmp
          env -i PATH=/usr/bin:/bin /tmp/relocated/bin/ffmpeg -version | head -1
          env -i PATH=/usr/bin:/bin /tmp/relocated/bin/ffprobe -version | head -1
          env -i PATH=/usr/bin:/bin /tmp/relocated/bin/dvdauthor --version 2>&1 | head -1 || true
          echo "All bundled tools ran without Homebrew present."

      - name: Confirm the bundled tools are Intel and will run on macOS 12
        run: |
          set -euo pipefail
          # Two ways this build can produce a .dmg that installs and then cannot
          # make a disc, and neither is visible from the app launching:
          #
          #   1. the tools are the wrong architecture, so they will not execute;
          #   2. the tools need a newer macOS than the Mac they are for.
          #
          # Both are checked here rather than discovered on somebody's laptop.
          echo "--- architectures ---"
          for tool in ffmpeg ffprobe dvdauthor spumux; do
            ARCHS="$(lipo -archs "vendor/bin/${tool}")"
            echo "${tool}: ${ARCHS}"
            case "${ARCHS}" in
              *x86_64*) ;;
              *) echo "ERROR: ${tool} is ${ARCHS}, not x86_64. On an Apple Silicon" >&2
                 echo "       runner Homebrew installs arm64 tools, which cannot" >&2
                 echo "       run on an Intel Mac. Check the runner label." >&2
                 exit 1 ;;
            esac
          done

          echo "--- minimum macOS each tool needs ---"
          FAILED=0
          UNKNOWN=0
          for tool in ffmpeg ffprobe dvdauthor spumux; do
            # Two load commands carry this, and which one is used depends on the
            # toolchain that built the binary:
            #   LC_BUILD_VERSION       prints "minos 12.0"
            #   LC_VERSION_MIN_MACOSX  prints "version 10.13"
            # Looking only for "minos" silently skipped every older binary and
            # reported the check as satisfied, which is the worst way to fail.
            MINOS="$(otool -l "vendor/bin/${tool}" 2>/dev/null \
                     | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' \
                     | grep -E '^ *(minos|version) ' \
                     | head -1 | awk '{print $2}')"
            echo "${tool}: minimum macOS ${MINOS:-could not be read}"
            if [ -z "${MINOS}" ]; then
              UNKNOWN=1
              continue
            fi
            # Anything above 12 cannot run on macOS 12.7.6.
            MAJOR="${MINOS%%.*}"
            if [ "${MAJOR}" -gt 12 ]; then
              echo "ERROR: ${tool} needs macOS ${MINOS}, but the target Mac runs 12.7.6." >&2
              FAILED=1
            fi
          done
          if [ "${FAILED}" -ne 0 ]; then
            echo "" >&2
            echo "The Homebrew bottles are too new for this Mac. Replace them with" >&2
            echo "builds that target macOS 12 — a static ffmpeg for x86_64, and" >&2
            echo "dvdauthor compiled with -mmacosx-version-min=12.0." >&2
            exit 1
          fi
          if [ "${UNKNOWN}" -ne 0 ]; then
            echo "::warning::The minimum macOS of at least one tool could not be read, so its compatibility with macOS 12.7.6 is unverified."
          fi

      - name: Confirm the bundled tools are present before packaging
        run: |
          set -euo pipefail
          # Packaging an app with no tools inside it would produce a .dmg that
          # installs cleanly and then cannot burn anything. Fail here instead.
          for tool in ffmpeg ffprobe dvdauthor spumux; do
            if [ ! -x "vendor/bin/${tool}" ]; then
              echo "ERROR: vendor/bin/${tool} is missing; the app would ship without it." >&2
              exit 1
            fi
          done
          if [ ! -d "vendor/bin/lib" ]; then
            echo "ERROR: vendor/bin/lib is missing; the tools would not run on another Mac." >&2
            exit 1
          fi
          echo "All four tools and $(ls vendor/bin/lib | wc -l | tr -d ' ') libraries are present."

      - name: Package version
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaging ${VERSION}"

      - name: Build the app
        env:
          # Ad-hoc signing. There is no Developer ID here, and there does not
          # need to be one: this build is handed to a person, not distributed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --x64 --publish never

      - name: Confirm the app bundle holds its tools
        run: |
          set -euo pipefail
          APP="$(find dist -maxdepth 3 -name '*.app' -type d | head -1)"
          echo "App bundle: ${APP}"
          test -n "${APP}"
          BIN="${APP}/Contents/Resources/bin"
          echo "--- bundled tools in the app ---"
          ls -la "${BIN}"
          test -x "${BIN}/ffmpeg"
          test -x "${BIN}/ffprobe"
          test -x "${BIN}/dvdauthor"
          test -x "${BIN}/spumux"
          echo "--- running ffmpeg from inside the app bundle ---"
          env -i PATH=/usr/bin:/bin "${BIN}/ffmpeg" -version | head -1

      - name: Confirm the app is Intel, like the Mac it is for
        run: |
          set -euo pipefail
          APP="$(find dist -maxdepth 3 -name '*.app' -type d | head -1)"
          MAIN="$(find "${APP}/Contents/MacOS" -type f -perm +111 | head -1)"
          echo "--- the app itself ---"
          lipo -archs "${MAIN}"
          case "$(lipo -archs "${MAIN}")" in
            *x86_64*) ;;
            *) echo "ERROR: the app is not x86_64 and will not run on an Intel Mac." >&2
               exit 1 ;;
          esac
          echo "--- bundled tool architectures ---"
          for tool in ffmpeg ffprobe dvdauthor spumux; do
            echo -n "${tool}: "
            lipo -archs "${APP}/Contents/Resources/bin/${tool}"
          done

      - name: List what was produced
        run: ls -la dist/

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Burnhouse-dmg
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Burnhouse ${{ steps.package.outputs.version }}
          body: |
            ## Burnhouse ${{ steps.package.outputs.version }}

            A stable DVD maker for macOS. Everything needed to build and burn a
            disc is inside the app — nothing else to install.

            **To install:** open the `.dmg`, drag Burnhouse to Applications, then
            right-click Burnhouse in Applications and choose **Open** the first
            time. macOS shows a warning because the app is not notarised; the
            right-click is how you tell it you trust it.

            **What it does:** add videos, design a menu, burn a DVD that plays in
            a normal DVD player.
          files: |
            dist/*.dmg
            dist/*.zip
          draft: false
          prerelease: false
